name = "moa-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Serve on your own domain so the App Clip's associated domain and the QR URL match.
# routes = [{ pattern = "moa.example.com", custom_domain = true }]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "moa-relay"

[vars]
TEAM_ID = "XXXXXXXXXX"            # Apple Developer Team ID
CLIP_BUNDLE_ID = "com.leeo.moa.Clip"
APP_STORE_ID = ""                  # numeric App Store ID once published (for the Safari banner)
MAX_UPLOAD_BYTES = "104857600"     # 100 MB, the Workers request-body limit on Free/Pro plans
